<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/sync.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" sizes="192x192" href="/stargazer-192.png">
  <title>Stargazer - Particle Settings</title>
  <style>
    /* Font import */
    @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap");

    /* General reset */
    * {
      font-family: Verdana, Geneva, Tahoma, sans-serif;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
      background: linear-gradient(to bottom, rgba(23, 23, 23, 1) 0%, rgba(13, 13, 13, 1) 99%);
      background-size: cover;
      background-attachment: fixed;
      animation: fadeInAnimation ease-in-out 1.2s forwards;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      overflow-y: auto;
    }

    @keyframes fadeInAnimation {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    .settings-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
      z-index: 10;
    }

    .settings-container h1 {
      color: #efef88;
      font-size: 40px;
      font-weight: 500;
      text-align: center;
      margin-bottom: 20px;
    }

    .particle-buttons {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .particle-button {
      color: #efef88;
      font-size: 25px;
      background: transparent;
      border: none;
      transition: all 0.5s ease;
      border-radius: 35px;
      cursor: pointer;
      padding: 10px 20px;
    }

    .particle-button:hover,
    .particle-button.selected {
      color: #000;
      font-size: 30px;
      background: linear-gradient(
        90deg,
        rgba(180, 132, 65, 1) 0%,
        rgba(239, 239, 136, 1) 50%,
        rgba(186, 138, 79, 1) 100%
      );
      border-radius: 35px;
    }

    #particles-js {
      position: fixed;
      width: 100%;
      height: 100%;
      z-index: -1;
      opacity: 1;
      transition: opacity 0.6s ease;
    }
    .settings-container{margin:auto;padding:28px 12px}
    .account-section{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:10px;padding:18px 22px;max-width:440px;border:1px solid rgba(239,239,136,.3);border-radius:24px;background:rgba(0,0,0,.35)}
    .account-section h2{color:#efef88;font-size:28px;font-weight:500}
    .account-section p{color:#bdbdbd;font-size:14px;text-align:center;line-height:1.45}
    .account-section .particle-button{font-size:20px;border:1px solid rgba(239,239,136,.5)}
    .account-section .particle-button:hover{font-size:21px}
  </style>
</head>
<body>
  <div class="settings-container">
    <h1>Particle Effects</h1>
    <div class="particle-buttons">
      <button class="particle-button" data-effect="off">Off</button>
      <button class="particle-button" data-effect="stars">Stars</button>
      <button class="particle-button" data-effect="shapes">Shapes</button>
      <button class="particle-button" data-effect="bubbles">Bubbles</button>
      <button class="particle-button" data-effect="snow">Snow</button>
    </div>
    <label style="color:white">Movie titles and descriptions <select id="language"><option value="en-US">English</option><option value="es-ES">Español</option><option value="fr-FR">Français</option></select></label>
    <div class="account-section">
      <h2>Account</h2>
      <p data-sgs-status>Sign in to sync My List, Continue Watching, favorites and settings across your devices.</p>
      <button class="particle-button" type="button" data-sgs-open>Sign in / Sign up</button>
    </div>
  </div>

  <div id="particles-js"></div>

  <script src="particles.min.js"></script>
  <script src="particle-config.js"></script>
  <script>
    const language = document.getElementById("language");
    language.value = localStorage.getItem("catalogLanguage") || "en-US";
    language.onchange = () => {
      localStorage.setItem("catalogLanguage", language.value);
      window.parent.postMessage({type:"catalogLanguage"}, location.origin);
    };
    const buttons = document.querySelectorAll("[data-effect]");
    function highlight() {
      buttons.forEach(button => {
        const selected = button.dataset.effect === currentEffect;
        button.classList.toggle("selected", selected);
        button.setAttribute("aria-pressed", selected);
      });
    }
    highlight();
    buttons.forEach(button => button.onclick = () => {
      localStorage.setItem("selectedEffect", button.dataset.effect);
      initParticles(button.dataset.effect);
      highlight();
      window.parent.postMessage({type:"particleEffect", effect:currentEffect}, location.origin);
    });
  </script>
</body>
</html>

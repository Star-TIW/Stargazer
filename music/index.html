<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#10100e">
  <title>Music · Stargazer</title>
  <link rel="icon" href="/stargazer-192.png">
  <link rel="stylesheet" href="/home.css">
  <link rel="stylesheet" href="/music/music.css">
</head>
<body>
  <div id="shapes"></div><div id="stars"></div><div id="bubbles"></div><div id="snow"></div><div id="particles-js"></div>
  <header class="header">
    <div class="brand-group"><img class="logo-small" src="/stargazer-512.png" alt="Stargazer logo"><h1 class="brand">Stargazer</h1></div>
    <button type="button" class="menu-toggle" aria-label="Open navigation" aria-controls="navbar" aria-expanded="false"><span></span></button>
    <nav class="navbar" id="navbar">
      <a href="/" class="nav-button">Main</a><a href="/live/" class="nav-button">Live</a><a aria-current="page" href="/music/" class="nav-button">Music</a>
      <button class="nav-button" id="settings-btn">Settings</button>
    </nav>
  </header>
  <main class="studio">
    <section class="mast">
      <div class="mast-copy">
      <h2>Music</h2>
      <form id="find" role="search">
        <input type="search" id="query" maxlength="120" aria-label="Search official songs and artists" placeholder="Search songs or artists…">
        <button type="submit">Search</button>
      </form>
      </div>
      <button type="button" id="featured" hidden><img alt="" id="feature-art"><span class="feature-copy"><small>Featured release</small><strong id="feature-title"></strong><span id="feature-artist"></span></span><span class="feature-play" aria-hidden="true">▶</span></button>
    </section>
    <nav class="filters" aria-label="Music collection">
      <button data-view="all" aria-pressed="true">Discover</button>
      <button data-view="saved" aria-pressed="false">♥ Saved</button>
    </nav>
    <div id="catalog"></div>
  </main>
  <aside id="dock" aria-label="Music player" hidden>
    <div class="dock-head"><strong id="playing"></strong><button id="close" aria-label="Close player">×</button></div>
    <audio id="audio" preload="metadata"></audio>
    <div class="transport">
      <div class="buttons">
        <button id="previous" aria-label="Previous track" title="Previous track">◀◀</button>
        <button id="play">Play</button>
        <button id="next" aria-label="Next track" title="Next track">▶▶</button>
        <button id="repeat" aria-label="Repeat track" aria-pressed="false">Repeat</button>
      </div>
      <label class="timeline"><span id="elapsed">0:00</span><input id="seek" type="range" min="0" max="0" step="1" value="0" aria-label="Playback position" disabled><span id="duration">0:00</span></label>
      <div class="loudness"><button id="mute" aria-pressed="false">Mute</button><input id="volume" aria-label="Volume" type="range" min="0" max="100" value="80"><output for="volume" id="percent">80%</output></div>
    </div>
    <p id="audio-status" role="status"></p>
  </aside>
  <script src="/particles.min.js"></script>
  <script src="/particle-config.js"></script>
  <script src="/music/music.js"></script>
</body>
</html>

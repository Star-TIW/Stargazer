<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#10100e">
  <title>Music · Stargazer</title>
  <link rel="icon" href="/stargazer-192.png">
  <link rel="stylesheet" href="/home.css">
  <link rel="stylesheet" href="/movies.css">
  <link rel="stylesheet" href="/music/music.css">
</head>
<body>
  <div id="shapes"></div><div id="stars"></div><div id="bubbles"></div><div id="snow"></div><div id="particles-js"></div>
  <header class="header">
    <div class="brand-group"><img class="logo-small" src="/stargazer-512.png" alt="Stargazer logo"><h1 class="brand">Stargazer</h1></div>
    <button type="button" class="menu-toggle" aria-label="Open navigation" aria-controls="navbar" aria-expanded="false"><span></span></button>
    <nav class="navbar" id="navbar">
      <a href="/" class="nav-button">Main</a><a href="/live/" class="nav-button">Live</a><a aria-current="page" href="/music/" class="nav-button">Music</a>
      <button class="nav-button" id="settings-btn">Settings</button>
    </nav>
  </header>
  <main class="studio">
    <section class="music-hero hero-content">
      <p class="eyebrow">Stargazer Music</p>
      <h2>Find your next favorite song.</h2>
      <p class="hero-copy">Search official releases or let your DJ put a mix together.</p>
      <form id="search-container" class="search-shell" role="search"><span class="search-icon" aria-hidden="true">⌕</span><input id="search" type="search" autocomplete="off" maxlength="120" aria-label="Search official songs and artists" placeholder="Search songs &amp; artists…"></form>
    </section>
    <div class="workspace">
      <nav class="filters rail" aria-label="Your library">
        <button data-view="all" aria-label="Discover music" title="Discover music" aria-pressed="true">♫</button>
        <button data-view="saved" aria-label="Liked songs" title="Liked songs" aria-pressed="false">♥</button>
        <button data-view="dj" aria-label="Stargazer DJ" title="Stargazer DJ" aria-pressed="false">DJ</button>
        <div id="shortcuts"></div>
      </nav>
      <section class="browse" aria-label="Browse music">
        <section id="dj-card" hidden>
          <div><p class="eyebrow">Stargazer DJ</p><h2>Your personal mix</h2><p id="dj-description"></p></div>
          <div class="dj-actions"><button id="dj-play" disabled>▶ Play mix</button><button id="dj-new" disabled>New mix</button><button id="dj-save" disabled>Save playlist</button></div>
        </section>
        <div id="playlists"></div>
        <div id="catalog" aria-live="polite"></div>
      </section>
      <aside id="now"><h2>Now playing</h2><div id="visual"><img id="now-art" alt=""><div id="mount" hidden></div></div><strong id="now-title"></strong><span id="now-artist"></span><h3>Up next</h3><div id="up-next"></div></aside>
    </div>
  </main>
  <aside id="dock" aria-label="Music player" hidden>
    <div class="dock-head"><strong id="playing"></strong><button id="close" aria-label="Close player">×</button></div>

    <div class="transport">
      <div class="buttons">
        <button id="previous" aria-label="Previous track" title="Previous track">◀◀</button>
        <button id="play">Play</button>
        <button id="next" aria-label="Next track" title="Next track">▶▶</button>
        <button id="repeat" aria-label="Repeat track" aria-pressed="false">Repeat</button>
      </div>
      <label class="timeline"><span id="elapsed">0:00</span><input id="seek" type="range" min="0" max="0" step="1" value="0" aria-label="Playback position" disabled><span id="duration">0:00</span></label>
      <div class="loudness"><button id="mute" aria-pressed="false">Mute</button><input id="volume" aria-label="Volume" type="range" min="0" max="100" value="80"><output for="volume" id="percent">80%</output></div>
    </div>
    <p id="audio-status" role="status"></p>
  </aside>
  <script src="/particles.min.js"></script>
  <script src="/particle-config.js"></script>
  <script src="/music/mixes.js"></script>
  <script src="/music/music.js"></script>
</body>
</html>

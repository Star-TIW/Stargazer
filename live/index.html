<!DOCTYPE html>
<html lang="en">

<head>
  <script src="/sync.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="192x192" href="/stargazer-192.png">
  <title>Stargazer Live - Sports</title>
  
  <link rel="stylesheet" href="/home.css" />
  <link rel="stylesheet" href="live.css" />
  <link rel="stylesheet" href="/live/multiview.css" />
  <link rel="stylesheet" href="/live/tv.css" />
  <link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#efef88">

<link rel="apple-touch-icon" href="/stargazer-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stargazer">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">

</head>
<body>
  <div id="shapes"></div>
  <div id="stars"></div>
  <div id="bubbles"></div>
  <div id="snow"></div>

  <header class="header">
    <div class="brand-group">
      <img class="logo-small" src="/stargazer.png" alt="Star Logo" />
      <h1 class="brand">Stargazer</h1>
    </div>

    <button type="button" class="menu-toggle" aria-label="Open navigation" aria-controls="navbar" aria-expanded="false"><span></span></button>

    <nav class="navbar" id="navbar">
      <a href="/" class="nav-button">Main</a>
      <button class="nav-button" id="settings-btn">Settings</button>
    </nav>
  </header>

  <div id="particles-js"></div>
  
  <!-- Sport Selector -->
  <div class="sport-selector-container">
    <div class="sport-buttons">
      <button class="sport-btn" data-sport="nfl" aria-pressed="false">🏈 NFL</button>
      <button class="sport-btn" data-sport="nba" aria-pressed="false">🏀 NBA</button>
      <button class="sport-btn" data-sport="mlb" aria-pressed="false">⚾ MLB</button>
      <button class="sport-btn" data-sport="nhl" aria-pressed="false">🏒 NHL</button>
      <button class="sport-btn" data-sport="mls" aria-pressed="false">⚽ MLS</button>
      <button class="sport-btn" data-sport="cfb" aria-pressed="false">🏈 College Football</button>
      <button class="sport-btn" id="sg-tv-tab" type="button" aria-pressed="false">📺 TV</button>
    </div>
  </div>

  <section id="sg-tv" hidden aria-label="TV channels">
    <div class="sg-tv-heading"><h2>TV Channels</h2><p>Find major networks and free official live channels.</p></div>
    <div class="sg-tv-grid" id="sg-tv-grid"></div>
  </section>
  <div class="live-scroll-container">
    <div class="live-banner">
      <div class="banner-text" id="banner-text">
        Live Sports - Stargazer
      </div>
    </div>

    <main class="live-container">
      <section id="sg-multiview" aria-label="Multi-view">
        <button type="button" class="mv-toggle" aria-expanded="false" aria-controls="mv-panel">Multi-view</button>
        <div class="mv-panel" id="mv-panel" hidden>
          <div class="mv-head">
            <h2>Multi-view</h2>
            <div class="mv-actions">
              <label for="mv-layout">Layout</label>
              <select class="mv-layout" id="mv-layout"><option value="2">Dual</option><option value="4">Quad</option></select>
              <button type="button" class="mv-start" disabled>Start streams</button>
              <button type="button" class="mv-stop" disabled>Stop all</button>
            </div>
          </div>
          <p class="mv-count">0 / 2 selected</p>
          <div class="mv-picker" aria-label="Select live games"></div>
          <div class="mv-stage" hidden></div>
          <p class="mv-note">Choose a game to focus on.</p>
        </div>
      </section>

      <!-- Today’s Games Section -->
      <div class="games-section">
        <div class="games-header" data-target="today-games">
          <h2 class="live-title">Today's Games</h2>
          <span class="arrow">&#9660;</span>
        </div>
        <div id="today-games" class="games-list collapsible open">
        </div>
      </div>

      <!-- Upcoming Games Section -->
      <div class="games-section">
        <div class="games-header" data-target="upcoming-games">
          <h2 class="live-title">Upcoming Games</h2>
          <span class="arrow">&#9660;</span>
        </div>
        <div id="upcoming-games" class="games-list collapsible open">
        </div>
      </div>

    </main>
  </div>

  <script src="/live/tv.js"></script>
  <script src="/provider-frame.js"></script>
  <script src="/live/damitv.js"></script>
  <script src="/live/matchora.js"></script>
  <script src="/live/timstreams.js"></script>
  <script src="/live/ppv.js"></script>
  <script src="/live/multiview.js"></script>
  <script src="/live/live.js"></script>
  <script src="/particles.min.js"></script>
  <script src="/particle-config.js"></script>
  <script src="/bootstrap.js"></script>
  <script src="/analytics.js"></script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-G0V9JTCLBP"></script>
</body>

</html>

name: Stargazer test suite
on:
  push:
    branches:
      - st4rg4zer-test
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run complete regression suite
        run: node --test tests/*.test.cjs tests/*.test.js

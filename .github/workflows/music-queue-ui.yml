name: Music queue 400px browser QA
on:
  push:
    branches: [st4rg4zer-test]
    paths:
      - 'music/**'
      - 'service-worker.js'
      - 'tests/music-queue-browser.cjs'
      - 'tests/music-artwork-browser.cjs'
      - 'tests/music-features-browser.cjs'
      - 'tests/music-v56-browser.cjs'
      - '.github/workflows/music-queue-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install free Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify v56 Cloudflare preview and music routes
        run: |
          host=https://st4rg4zer-test.st4rg4zer.pages.dev
          ready=0
          for i in $(seq 1 40); do
            if curl --max-time 10 -fsSL "$host/service-worker.js?qa=$i" | grep -q 'stargazer-cache-v56'; then ready=1; break; fi
            sleep 3
          done
          if [ "$ready" = 0 ]; then echo "Cloudflare v56 preview unavailable"; exit 1; fi
          for route in 'artist/rl-grime?track=xnfi1Jv8yK8' 'playlist/test' library library/ dj saved; do
            title=$(curl -fsSL "$host/music/$route" | grep -o '<title>[^<]*</title>' | head -1)
            echo "$host/music/$route => $title"
            [ "$title" = '<title>Music · Stargazer</title>' ] || exit 1
          done
          curl -fsSL "$host/music/music.css?v=56" | grep -q 'artist-scroll-shelf'
          curl -fsSL "$host/music/music.js?v=56" | grep -q 'fadeBackupKey'
      - name: Check Vercel deployment (non-blocking while rate-limited)
        continue-on-error: true
        run: |
          curl --max-time 10 -fsSL https://stargazer-test.vercel.app/service-worker.js | grep -q 'stargazer-cache-v56'
      - name: Assert 400px artwork layout and nonplaying queue clicks
        env:
          STARGAZER_QA_URL: https://st4rg4zer-test.st4rg4zer.pages.dev/music/
        run: |
          node tests/music-queue-browser.cjs
          node tests/music-artwork-browser.cjs
          node tests/music-features-browser.cjs
          node tests/music-v56-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: music-queue-400px
          path: |
            music-queue-400px.png
            music-artwork-*.png
            music-features-*.png
          if-no-files-found: ignore

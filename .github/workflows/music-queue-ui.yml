name: Music queue 400px browser QA
on:
  push:
    branches: [st4rg4zer-test]
    paths:
      - 'music/**'
      - 'service-worker.js'
      - 'tests/music-queue-browser.cjs'
      - 'tests/music-artwork-browser.cjs'
      - 'tests/music-features-browser.cjs'
      - '.github/workflows/music-queue-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install free Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify both preview hosts and nested music routes
        run: |
          failed=0
          for host in https://stargazer-test.vercel.app https://st4rg4zer-test.st4rg4zer.pages.dev; do
            ready=0
            for i in $(seq 1 40); do
              if curl --max-time 10 -fsSL "$host/service-worker.js?qa=$i" | grep -q 'stargazer-cache-v52'; then ready=1; break; fi
              sleep 3
            done
            if [ "$ready" = 0 ]; then echo "$host v52 unavailable"; failed=1; continue; fi
            for route in 'artist/rl-grime?track=xnfi1Jv8yK8' 'playlist/qa' library dj; do
              curl -fsSL "$host/music/$route" | grep -q 'id="full-controls"' || failed=1
            done
            curl -fsSL "$host/music/music.css?v=52" | grep -q 'width:64px' || failed=1
          done
          exit "$failed"
      - name: Assert 400px artwork layout and nonplaying queue clicks
        run: |
          node tests/music-queue-browser.cjs
          node tests/music-artwork-browser.cjs
          node tests/music-features-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: music-queue-400px
          path: |
            music-queue-400px.png
            music-artwork-*.png
            music-features-*.png
          if-no-files-found: ignore
